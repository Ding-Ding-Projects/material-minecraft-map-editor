name: amulet-owner-site

services:
  amulet-site:
    build: .
    restart: unless-stopped
    ports:
      - "${AMULET_SITE_BIND:-127.0.0.1}:${AMULET_SITE_PORT:-8095}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.50
