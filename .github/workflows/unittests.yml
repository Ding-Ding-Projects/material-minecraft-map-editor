name: Unittests

on:
  push:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

# This workflow only produces a check result, so a newer push supersedes it
# outright.  Release and publishing workflows deliberately do not do this.
concurrency:
  group: unittests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The interface data model carries no wx dependency by design, so it is
  # checked on a runner with no display at all.  A regression that reintroduces
  # a display dependency into the registries fails here rather than at startup
  # on a user's machine.
  headless-import:
    name: Headless import and registry contract
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The job proves the data model needs no DISPLAY, not that it needs no
      # dependencies: amulet_map_editor/__init__.py imports platformdirs at
      # module scope, so the bare runner has to be given it.
      - name: Bootstrap import-time dependencies
        run: |
          python -m pip install --quiet platformdirs

      - name: Import the studio data modules without a display
        run: |
          python - <<'PY'
          import importlib
          import sys

          sys.path.insert(0, ".")
          modules = [
              "amulet_map_editor.api.studio.search",
              "amulet_map_editor.api.studio.spec",
          ]
          optional = [
              "amulet_map_editor.api.studio.specs",
              "amulet_map_editor.api.studio.surfaces",
              "amulet_map_editor.api.studio.ribbon_defs",
              "amulet_map_editor.api.studio.commands",
              "amulet_map_editor.api.studio.blocks",
              "amulet_map_editor.api.studio.memory_content",
              "amulet_map_editor.api.studio.nbt_model",
          ]
          for name in modules:
              importlib.import_module(name)
              print(f"imported {name}")
          missing = []
          for name in optional:
              try:
                  importlib.import_module(name)
              except ModuleNotFoundError:
                  missing.append(name)
                  continue
              print(f"imported {name}")
          if missing:
              print("not present in this revision: " + ", ".join(missing))
          PY

      - name: Verify no child process can open a console window
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_no_console_window_contract.py -q

      - name: Verify the surface registry is internally consistent
        run: |
          python - <<'PY'
          import importlib
          import sys

          sys.path.insert(0, ".")
          from amulet_map_editor.api.studio.spec import SECTION_KINDS

          specs = {}
          for name in (
              "core",
              "terrain_build",
              "entities_data",
              "analysis_worldgen",
              "tools_panels",
          ):
              try:
                  module = importlib.import_module(
                      f"amulet_map_editor.api.studio.specs.{name}"
                  )
              except ModuleNotFoundError:
                  print(f"specs.{name} is not present in this revision")
                  continue
              for key, value in module.SPECS.items():
                  assert key not in specs, f"duplicate surface key: {key}"
                  specs[key] = value

          for key, spec in specs.items():
              assert spec.key == key, f"{key}: spec.key disagrees with its registry key"
              assert spec.sections, f"{key}: surface has no sections"
              for section in spec.sections:
                  assert (
                      section.kind in SECTION_KINDS
                  ), f"{key}: unknown section kind {section.kind}"

          targets = {
              action.surface
              for spec in specs.values()
              for action in spec.actions
              if action.surface
          }
          handbuilt = {"nbt", "memory", "prefs", "regex", "history", "notifications",
                       "changelog", "docs", "tabManager", "palette", "dimsum"}
          missing = sorted(targets - set(specs) - handbuilt)
          assert not missing, f"actions point at surfaces that do not exist: {missing}"
          print(f"{len(specs)} surfaces, "
                f"{sum(len(s.sections) for s in specs.values())} sections, consistent")
          PY

  unittests:
    name: Test suite
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
    - name: Clone
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Install dependencies
      run: |
        pip install -e . pytest pytest-timeout pyyaml

    - name: Generate the changelog the tests read
      run: |
        python scripts/generate_changelog.py

    # pytest collects both styles.  ``unittest discover`` only finds TestCase
    # subclasses, which silently skipped every module-level ``def test_*``
    # in this suite — the majority of it.
    - name: Test with pytest
      run: |
        python -m pytest tests -v --timeout=300 --junitxml=test-results/junit.xml

    # Evidence survives a failure: the report is what says which test failed
    # and why, and it is worth nothing if it is only collected when green.
    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      continue-on-error: true
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results
        if-no-files-found: warn
        retention-days: 7
