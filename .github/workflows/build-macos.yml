name: Build macOS

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ${{ matrix.cfg.os }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        cfg:
        - {os: macos-15-intel, python-version: '3.11', architecture: x64}
        - {os: macos-15, python-version: '3.11', architecture: arm64}

    steps:
    - name: Clone
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.cfg.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.cfg.python-version }}

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Install dependencies
      run: |
        pip install twine pyinstaller~=6.18 build

    - name: Setup
      run: |
        export BDISTWHEELFREEZELIBS=true
        python -m build
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: PyInstaller build
      run: |
        # Code signing and notarisation are permanently disabled for this
        # project. Leaving APPLE_CODESIGN_IDENTITY unset makes PyInstaller
        # produce the unsigned app bundle without invoking a signer.
        unset APPLE_CODESIGN_IDENTITY
        python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

    - name: MacOS - Create DMG
      run: |
        brew install create-dmg
        mkdir -p "installer/dist/dmg"
        ditto "installer/dist/Amulet ${{ github.event.release.tag_name }}.app" "installer/dist/dmg/Amulet ${{ github.event.release.tag_name }}.app"
        create-dmg \
          --volname "Amulet ${{ github.event.release.tag_name }} installer" \
          --volicon "installer/logo.icns" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --icon "Amulet ${{ github.event.release.tag_name }}.app" 175 120 \
          --hide-extension "Amulet ${{ github.event.release.tag_name }}.app" \
          --app-drop-link 425 120 \
          "installer/dist/Amulet-${{ github.event.release.tag_name }}-macOS-${{ matrix.cfg.architecture }}.dmg" \
          "installer/dist/dmg"
        rm -rf "installer/dist/Amulet ${{ github.event.release.tag_name }}.app"
        rm -rf installer/dist/amulet
        rm -rf installer/dist/dmg

    - name: MacOS - Verify unsigned packaging
      run: |
        echo "Unsigned macOS DMG created; Apple signing and notarisation are intentionally disabled."
        echo "No xcrun credentials are required, and no signer or notarisation service was invoked."

    - name: Publish to PyPi
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.AMULET_MAP_EDITOR_PYPI_PASSWORD }}
      run: |
        twine upload dist/amulet[_-]map[_-]editor*.tar.gz --skip-existing

    - name: Upload Release Asset
      uses: actions/upload-artifact@v6
      with:
        name: Amulet-${{ github.event.release.tag_name }}-${{ runner.os }}-${{ matrix.cfg.architecture }}
        path: ./installer/dist
