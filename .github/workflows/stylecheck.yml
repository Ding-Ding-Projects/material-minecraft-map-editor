name: Stylecheck

on:
  push:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

# Style is a report, not a release gate: this job never appears in another
# job's `needs`, so a formatting nit can never withhold a build or an
# installer.  Its verdict still stays visible and honest.
concurrency:
  group: stylecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stylecheck:
    name: Formatting report
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - name: Clone
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install black

    - name: run stylecheck
      run: |
        python -m black --check --diff . | tee black-report.diff
        exit ${PIPESTATUS[0]}

    - name: Upload formatting report
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      continue-on-error: true
      with:
        name: black-report
        path: black-report.diff
        if-no-files-found: warn
        retention-days: 7
