name: Material 3 site

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      site_base_url:
        description: "Base URL for the owner-controlled static host (./ for root-relative output)"
        required: true
        default: "./"
        type: string

permissions:
  contents: read

env:
  SITE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.site_base_url || './' }}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dependency-free site source
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/site/app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          HTMLParser().feed(Path("docs/site/index.html").read_text(encoding="utf-8"))
          print("HTML parsed successfully")
          PY

      - name: Prepare owner-hosted static bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_site_bundle.py \
            --source docs/site \
            --output build/site \
            --base-url "$SITE_BASE_URL"
          python3 scripts/verify_site_release_manifest.py build/site

      - name: Archive exact static bundle
        shell: bash
        run: tar -czf "amulet-material3-static-bundle-${{ github.sha }}.tar.gz" -C build/site .

      - name: Build owner-hosted site image
        run: docker build --file build/site/Dockerfile --tag amulet-material3-site:${{ github.sha }} build/site

      - name: Export site image
        run: docker save amulet-material3-site:${{ github.sha }} | gzip -9 > amulet-material3-site-${{ github.sha }}.tar.gz

      - name: Upload owner-hosted image
        uses: actions/upload-artifact@v4
        with:
          name: amulet-material3-site-${{ github.sha }}
          path: amulet-material3-site-${{ github.sha }}.tar.gz
          if-no-files-found: error

      - name: Upload owner-hosted static bundle
        uses: actions/upload-artifact@v4
        with:
          name: amulet-material3-static-bundle-${{ github.sha }}
          path: amulet-material3-static-bundle-${{ github.sha }}.tar.gz
          if-no-files-found: error
