name: Build Windows

on:
  push:
    branches: ['0.10']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025, python-version: '3.11', architecture: x64 }
          - { os: windows-11-arm, python-version: '3.11', architecture: arm64 }

    runs-on: ${{ matrix.cfg.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.cfg.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.cfg.python-version }}
        architecture: ${{ matrix.cfg.architecture }}

    - name: Setup MSVC
      if: matrix.cfg.os == 'windows-11-arm'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Install dependencies
      run: |
        pip install twine pyinstaller~=6.18 build

    - name: Build Wheels
      shell: pwsh
      run: |
        $env:BDISTWHEELFREEZELIBS = "true"
        python -m build
        
    - name: Install Wheels
      run: |
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: PyInstaller build
      run: |
        python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

    - name: Resolve build version
      shell: pwsh
      run: |
        $version = '${{ github.event.release.tag_name }}'
        if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.ref_name }}' }
        if ([string]::IsNullOrWhiteSpace($version)) { $version = 'dev-${{ github.sha }}'.Substring(0, 16) }
        "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Windows - Install NSIS
      uses: repolevedavaj/install-nsis@v1.2.0
      with:
        nsis-version: '3.11'

    - name: Windows - Create unsigned NSIS installer
      run: |
        makensis -DVERSION=${BUILD_VERSION} -DARCH=${{ matrix.cfg.architecture }} installer/windows.nsi
        rm -rf installer/dist/amulet

    - name: Verify unsigned installer contract
      shell: pwsh
      run: |
        $installer = Join-Path $PWD "installer/dist/Amulet-$env:BUILD_VERSION-Windows-${{ matrix.cfg.architecture }}.exe"
        if (-not (Test-Path -LiteralPath $installer)) {
          throw "Expected NSIS installer was not produced: $installer"
        }
        $signature = Get-AuthenticodeSignature -LiteralPath $installer
        if ($signature.Status -ne 'NotSigned') {
          throw "Installer must remain unsigned; observed Authenticode status '$($signature.Status)'."
        }
        Write-Host "Unsigned installer verified: $installer"

    - name: Publish to PyPi
      if: github.event_name == 'release'
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.AMULET_MAP_EDITOR_PYPI_PASSWORD }}
      run: |
        twine upload dist/amulet[_-]map[_-]editor*.tar.gz --skip-existing

    - name: Upload Release Asset
      uses: actions/upload-artifact@v6
      with:
        name: Amulet-${{ env.BUILD_VERSION }}-${{ runner.os }}-${{ matrix.cfg.architecture }}
        path: ./installer/dist
