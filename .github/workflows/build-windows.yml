name: Build Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.body, '<!-- amulet-auto-release -->') }}
    outputs:
      build_version: ${{ steps.resolve-version.outputs.build_version }}
      tests_passed: ${{ steps.release-gating-tests.outcome == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025, python-version: '3.11', architecture: x64 }

    runs-on: ${{ matrix.cfg.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v6
      with:
        # Changelog generation and release-gating tests inspect every reachable
        # release tag; a shallow checkout makes the catalog empty on Windows.
        fetch-depth: 0

    - name: Set up Python ${{ matrix.cfg.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.cfg.python-version }}
        architecture: ${{ matrix.cfg.architecture }}

    - name: Install dependencies
      run: |
        pip install twine pyinstaller~=6.18 build pytest

    - name: Build Wheels
      shell: pwsh
      run: |
        $env:BDISTWHEELFREEZELIBS = "true"
        python -m build
        
    - name: Install Wheels
      run: |
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: Run release-gating tests
      id: release-gating-tests
      run: |
        python scripts/generate_changelog.py
        python -m unittest discover -v -s tests

    - name: PyInstaller build
      run: |
        python scripts/run_with_timeout.py --seconds 900 -- -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

    - name: Resolve build version
      id: resolve-version
      shell: pwsh
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        $raw = $env:RELEASE_TAG
        $fallback = "0.10.0-dev.$env:RUN_NUMBER"
        if ([string]::IsNullOrWhiteSpace($raw)) { $raw = $fallback }
        $version = (python scripts/normalize_squirrel_version.py --raw $raw --fallback $fallback).Trim()
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
          throw "Could not normalize Squirrel version from '$raw' with fallback '$fallback'."
        }
        "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "build_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Fetch previous Squirrel feed for delta
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        CURRENT_VERSION: ${{ env.BUILD_VERSION }}
        CURRENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        $destination = Join-Path $PWD 'installer\dist\squirrel\previous'
        New-Item -ItemType Directory -Force $destination | Out-Null
        $candidates = @()
        try {
          $releaseJson = & gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft,isPrerelease,publishedAt
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed with exit code $LASTEXITCODE" }
          $releases = $releaseJson | ConvertFrom-Json
          $candidates = @($releases |
            Where-Object { -not $_.isDraft -and $_.tagName -ne $env:CURRENT_RELEASE_TAG } |
            Sort-Object publishedAt -Descending)
        } catch {
          Write-Warning "Could not enumerate prior releases; delta generation will be skipped: $($_.Exception.Message)"
        }
        $selectedPackage = $null
        $selectedReleases = $null
        :releaseSearch foreach ($candidate in $candidates) {
          $candidateDirectory = Join-Path $destination ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $candidateDirectory | Out-Null
          try {
            & gh release download $candidate.tagName --repo $env:GITHUB_REPOSITORY --pattern 'RELEASES' --dir $candidateDirectory --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release download RELEASES failed with exit code $LASTEXITCODE" }
            & gh release download $candidate.tagName --repo $env:GITHUB_REPOSITORY --pattern 'Amulet-*-full.nupkg' --dir $candidateDirectory --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release download full package failed with exit code $LASTEXITCODE" }
            $releaseIndexes = @(Get-ChildItem $candidateDirectory -File -Filter 'RELEASES')
            if ($releaseIndexes.Count -ne 1) {
              throw "Release $($candidate.tagName) must contain exactly one RELEASES index; found $($releaseIndexes.Count)."
            }
            $packages = @(Get-ChildItem $candidateDirectory -File -Filter 'Amulet-*-full.nupkg')
            if (-not $packages) {
              Write-Warning "Release $($candidate.tagName) had no full package; this candidate was skipped."
            }
            foreach ($package in $packages) {
              $validation = & python scripts/validate_squirrel_delta_base.py --current $env:CURRENT_VERSION --package $package.FullName --releases $releaseIndexes[0].FullName 2>&1
              if ($LASTEXITCODE -eq 0) {
                $selectedPackage = $package
                $selectedReleases = $releaseIndexes[0]
                Write-Host "Previous Squirrel feed selected for delta: $($package.Name) + RELEASES ($validation)"
                break releaseSearch
              }
              Write-Warning "Skipping unsafe delta base from $($candidate.tagName): $validation"
            }
          } catch {
            Write-Warning "Could not inspect release $($candidate.tagName) for a delta base: $($_.Exception.Message)"
          }
        }
        if ($selectedPackage -and $selectedReleases) {
          "PREVIOUS_PACKAGE=$($selectedPackage.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_RELEASES=$($selectedReleases.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
          Write-Host 'No prior release available; this is a full-only first release.'
          "PREVIOUS_PACKAGE=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_RELEASES=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }

    - name: Windows - Create unsigned Squirrel.Windows release
      shell: pwsh
      run: >-
        ./installer/build-squirrel.ps1
        -Version "$env:BUILD_VERSION"
        -Architecture '${{ matrix.cfg.architecture }}'
        -InputDirectory "$PWD/installer/dist/amulet"
        -OutputDirectory "$PWD/installer/dist/squirrel"
        -PreviousPackagePath "$env:PREVIOUS_PACKAGE"
        -PreviousReleasesPath "$env:PREVIOUS_RELEASES"

    - name: Verify unsigned installer contract
      shell: pwsh
      run: |
        $releaseDir = Join-Path $PWD "installer/dist/squirrel/Amulet-$env:BUILD_VERSION-Windows-${{ matrix.cfg.architecture }}"
        $required = @('Setup.exe', 'RELEASES', "Amulet-$env:BUILD_VERSION-full.nupkg")
        if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_PACKAGE)) {
          $required += "Amulet-$env:BUILD_VERSION-delta.nupkg"
        }
        foreach ($name in $required) {
          $path = Join-Path $releaseDir $name
          if (-not (Test-Path -LiteralPath $path)) { throw "Expected Squirrel artifact was not produced: $path" }
        }
        $releaseIndex = Get-Content (Join-Path $releaseDir 'RELEASES') -Raw
        if ($releaseIndex -notmatch [regex]::Escape("Amulet-$env:BUILD_VERSION-full.nupkg")) { throw 'RELEASES does not reference the full package' }
        $releaseNames = @($releaseIndex -split '\r?\n' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | ForEach-Object { ($_ -split '\s+')[1] })
        $expectedReleaseNames = @("Amulet-$env:BUILD_VERSION-full.nupkg")
        if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_PACKAGE)) {
          $expectedReleaseNames += "Amulet-$env:BUILD_VERSION-delta.nupkg"
        }
        $difference = @(Compare-Object -ReferenceObject $expectedReleaseNames -DifferenceObject $releaseNames)
        if ($difference.Count -ne 0) {
          throw "RELEASES advertises files outside the publishable current release: $($releaseNames -join ', ')"
        }
        Get-ChildItem $releaseDir -File -Include '*.exe', '*.dll' | ForEach-Object {
          $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unsigned policy violated for $($_.Name): $($signature.Status)" }
        }
        Write-Host "Unsigned Squirrel.Windows artifacts verified: $releaseDir"

    - name: Publish to PyPi
      if: github.event_name == 'release'
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.AMULET_MAP_EDITOR_PYPI_PASSWORD }}
      run: |
        twine upload dist/amulet[_-]map[_-]editor*.tar.gz --skip-existing

    - name: Upload Release Asset
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      continue-on-error: true
      with:
        name: Amulet-${{ steps.resolve-version.outputs.build_version }}-${{ runner.os }}-${{ matrix.cfg.architecture }}
        path: ./installer/dist/squirrel/Amulet-${{ steps.resolve-version.outputs.build_version }}-Windows-${{ matrix.cfg.architecture }}
        if-no-files-found: warn
        retention-days: 7

  publish:
    name: Publish unsigned Squirrel release
    needs: deploy
    # A release created by this job emits a `published` event of its own.  The
    # marker in our notes prevents that event from trying to upload the same
    # immutable assets a second time, while still allowing manually published
    # releases to use this path.
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.tests_passed == 'true' && (github.event_name != 'release' || !contains(github.event.release.body, '<!-- amulet-auto-release -->')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          # Surviving-line attribution needs the historical commits and blobs
          # that own the checked-out lines; a depth-one clone cannot prove it.
          fetch-depth: 0
      - name: Download x64 Squirrel artifacts
        uses: actions/download-artifact@v4
        with:
          name: Amulet-${{ needs.deploy.outputs.build_version }}-Windows-x64
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ github.event.release.tag_name || '' }}
          RELEASE_TAG_FALLBACK: 0.10.0-dev.${{ github.run_number }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          setup_path="$(find release-assets -type f -name 'Setup.exe' -print -quit)"
          releases_path="$(find release-assets -type f -name 'RELEASES' -print -quit)"
          nupkg_path="$(find release-assets -type f -name '*-full.nupkg' -print -quit)"
          test -n "$setup_path" || { echo 'Setup.exe was not found in the downloaded artifact'; exit 1; }
          test -n "$releases_path" || { echo 'RELEASES was not found in the downloaded artifact'; exit 1; }
          test -n "$nupkg_path" || { echo 'full Squirrel package was not found in the downloaded artifact'; exit 1; }
          if [[ "$setup_path" != "release-assets/Setup.exe" ]]; then cp -- "$setup_path" release-assets/Setup.exe; fi
          if [[ "$releases_path" != "release-assets/RELEASES" ]]; then cp -- "$releases_path" release-assets/RELEASES; fi
          nupkg_name="$(basename -- "$nupkg_path")"
          if [[ "$nupkg_path" != "release-assets/$nupkg_name" ]]; then cp -- "$nupkg_path" "release-assets/$nupkg_name"; fi
          # Both event data and the fallback stay in environment variables;
          # the helper validates them before the value reaches the release API.
          tag="$(python3 scripts/normalize_release_tag.py)"
          started="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | startswith("deploy")) | .started_at' | sed -n '1p')"
          test -n "$started" || { echo 'Could not resolve the deploy job start time for release timing notes'; exit 1; }
          line_table="$(python3 scripts/count_lines.py)"
          while IFS='=' read -r key value; do
            case "$key" in
              DIM_SUM_CODE_NAME) DIM_SUM_CODE_NAME="$value" ;;
              DIM_SUM_PHOTO_URL) DIM_SUM_PHOTO_URL="$value" ;;
            esac
          done < <(python3 scripts/resolve_dim_sum_code_name.py)
          test -n "${DIM_SUM_CODE_NAME:-}" || { echo 'Dim-sum code name was not resolved'; exit 1; }
          test -n "${DIM_SUM_PHOTO_URL:-}" || { echo 'Dim-sum public photo URL was not resolved'; exit 1; }
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          write_notes() {
            local completed="$1"
            local duration="$2"
            {
              printf '%s\n' '<!-- amulet-auto-release -->'
              printf '%s\n' "Unsigned Squirrel.Windows release. Code signing is intentionally disabled; the operating system may show an unknown-publisher warning."
              printf '%s\n' "Workflow started: $started"
              printf '%s\n' "Workflow completed: $completed"
              printf '%s\n\n' "Workflow duration: $duration"
              printf '%s\n' "Line count and surviving attribution (CI, scripts/count_lines.py):"
              printf '%s\n' '```csv'
              printf '%s\n' "$line_table"
              printf '%s\n\n' '```'
              printf '%s\n' "Generated text and deliberately excluded text are separate rows; repository-grand-total is every tracked line-oriented text file counted. Binary assets are not line-counted."
              printf '%s\n' "Agent attribution uses surviving git-blame lines whose commit author or Co-Authored-By trailer identifies an automation agent; person and unattributed lines are reported separately."
              printf '%s\n' "Dim-sum code name: $DIM_SUM_CODE_NAME"
              printf '%s\n' "Dim-sum public photo: $DIM_SUM_PHOTO_URL"
            } > "$notes_file"
          }
          upload_paths=("release-assets/Setup.exe" "release-assets/RELEASES" "release-assets/$nupkg_name")
          while IFS= read -r path; do
            case "$(basename -- "$path")" in
              Setup.exe|RELEASES|"$nupkg_name") ;;
              *) upload_paths+=("$path") ;;
            esac
          done < <(find release-assets -type f -print)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r existing; do
              for path in "${upload_paths[@]}"; do
                if [[ "$existing" == "$(basename -- "$path")" ]]; then
                  echo "Refusing to replace immutable release asset: $existing"
                  exit 1
                fi
              done
            done < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$tag" "${upload_paths[@]}" --repo "$GITHUB_REPOSITORY"
            # A manually published release already exists.  Its workflow
            # completion is the point at which this run finishes attaching
            # the verified assets, not a timestamp sampled before the upload.
            completed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            # Keep the marker in draft notes so the published event generated
            # below cannot start a duplicate packaging run.  Timing stays
            # explicitly pending until GitHub confirms actual publication.
            write_notes 'publication-pending' 'publication-pending'
            gh release create "$tag" "${upload_paths[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Amulet Map Editor $tag" \
              --notes-file "$notes_file" \
              --target "$RUN_SHA" \
              --draft
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
            completed="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt')"
            test -n "$completed" || { echo 'GitHub did not report a publication completion timestamp'; exit 1; }
          fi
          duration="$(python3 scripts/release_timing.py --started "$started" --completed "$completed")"
          write_notes "$completed" "$duration"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"

          is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          test "$is_draft" = 'false' || { echo 'Release remained a draft after publication'; exit 1; }
          final_body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          grep -Fqx "Workflow completed: $completed" <<< "$final_body"
          grep -Fqx "Workflow duration: $duration" <<< "$final_body"
